name: Publier une version

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version et URLs du manifeste
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg m "$REPO/releases/latest/download/system.json" \
             --arg d "$REPO/releases/download/$TAG/noctis.zip" \
             '.version=$v | .manifest=$m | .download=$d' system.json > system.tmp
          mv system.tmp system.json

      - name: Archive
        run: zip -r noctis.zip system.json noctis.mjs module templates styles lang assets data LICENSE.txt README.md README.fr.md -x "*/_preview*"

      - name: Créer ou compléter la release
        uses: softprops/action-gh-release@v2
        with:
          name: Noctis ${{ github.ref_name }}
          make_latest: true
          body: |
            Manifest: https://github.com/${{ github.repository }}/releases/latest/download/system.json
            Free fan content under the Dark Pack. Portions of the materials are the copyrights and trademarks of Paradox Interactive AB, and are used with permission. All rights reserved. For more information please visit worldofdarkness.com. Not official World of Darkness material.
          files: |
            system.json
            noctis.zip
